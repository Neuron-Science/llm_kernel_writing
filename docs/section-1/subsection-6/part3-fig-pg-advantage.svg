<svg xmlns="http://www.w3.org/2000/svg" width="470" height="560" viewBox="0 0 470 560" role="img" aria-label="Why the policy gradient uses an advantage instead of the raw reward, on four answers sampled for one task. Top block, the raw reward: it is never negative, so the two wrong answers get a bar of zero length and no gradient signal at all. Bottom block, the advantage: the baseline b of x, 0.50, is subtracted, so the two correct answers get plus 0.50 and are pushed up while the two wrong answers get minus 0.50 and are actively pushed down. Both blocks share the same zero line, so the shift is visible directly: same gradient in expectation, less variance.">
  <rect x="0" y="0" width="470" height="560" fill="#eef2f6"/>
  <rect x="14" y="10" width="442" height="52" rx="9" ry="9" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="30" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#334155">x = "Solve 2x + 3 = 11"</text>
  <text x="30" y="50" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#64748b">k = 4 answers sampled,  r = 1 if it checks out</text>
  <rect x="14" y="76" width="442" height="224" rx="14" ry="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="30" y="102" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">RAW   r</text>
  <text x="30" y="120" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">r ≥ 0 always — a wrong answer gets zero</text>
  <rect x="342.093" y="86" width="99.9066" height="20" rx="10" ry="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="392.047" y="99.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#9a3412">high variance</text>
  <text x="30" y="284" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">no negative signal anywhere</text>
  <text x="280" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#94a3b8">0</text>
  <text x="400" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#94a3b8">1</text>
  <line x1="280" y1="142" x2="280" y2="258" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="32" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#64748b">y1</text>
  <text x="56" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#334155">"2x = 8, x = 7"</text>
  <text x="288" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#c2410c">r = 0</text>
  <text x="32" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#64748b">y2</text>
  <text x="56" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#334155">"2x = 8, x = 4"</text>
  <rect x="280" y="182" width="120" height="12" rx="3" ry="3" fill="#0d9488" stroke="#0d9488" stroke-width="1.2"/>
  <text x="408" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#0f766e">r = 1</text>
  <text x="32" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#64748b">y3</text>
  <text x="56" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#334155">"2x = 6, x = 3"</text>
  <text x="288" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#c2410c">r = 0</text>
  <text x="32" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#64748b">y4</text>
  <text x="56" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#334155">"x = (11-3)/2"</text>
  <rect x="280" y="242" width="120" height="12" rx="3" ry="3" fill="#0d9488" stroke="#0d9488" stroke-width="1.2"/>
  <text x="408" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#0f766e">r = 1</text>
  <rect x="14" y="314" width="442" height="232" rx="14" ry="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="30" y="340" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">ADVANTAGE   A</text>
  <text x="30" y="358" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">A = r − b(x),   b(x) = 0.50</text>
  <rect x="254.5" y="324" width="187.5" height="20" rx="10" ry="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
  <text x="348.25" y="337.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f766e">same gradient, less variance</text>
  <text x="30" y="530" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">the wrong answers are now pushed DOWN</text>
  <text x="280" y="370" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#334155">b(x)</text>
  <text x="420" y="370" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#64748b">push</text>
  <line x1="280" y1="380" x2="280" y2="496" stroke="#64748b" stroke-width="2"/>
  <text x="32" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#64748b">y1</text>
  <text x="56" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#94a3b8">"2x = 8, x = 7"</text>
  <rect x="220" y="390" width="60" height="12" rx="3" ry="3" fill="#dc2626" stroke="#dc2626" stroke-width="1.2"/>
  <text x="212" y="400" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#991b1b">−0.50</text>
  <line x1="420" y1="386" x2="420" y2="400" stroke="#dc2626" stroke-width="2"/>
  <polygon points="420,405.5 414.5,394.5 425.5,394.5" fill="#dc2626"/>
  <text x="32" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#64748b">y2</text>
  <text x="56" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#94a3b8">"2x = 8, x = 4"</text>
  <rect x="280" y="420" width="60" height="12" rx="3" ry="3" fill="#0d9488" stroke="#0d9488" stroke-width="1.2"/>
  <text x="348" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#0f766e">+0.50</text>
  <line x1="420" y1="434" x2="420" y2="420" stroke="#0d9488" stroke-width="2"/>
  <polygon points="420,414.5 414.5,425.5 425.5,425.5" fill="#0d9488"/>
  <text x="32" y="460" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#64748b">y3</text>
  <text x="56" y="460" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#94a3b8">"2x = 6, x = 3"</text>
  <rect x="220" y="450" width="60" height="12" rx="3" ry="3" fill="#dc2626" stroke="#dc2626" stroke-width="1.2"/>
  <text x="212" y="460" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#991b1b">−0.50</text>
  <line x1="420" y1="446" x2="420" y2="460" stroke="#dc2626" stroke-width="2"/>
  <polygon points="420,465.5 414.5,454.5 425.5,454.5" fill="#dc2626"/>
  <text x="32" y="490" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#64748b">y4</text>
  <text x="56" y="490" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#94a3b8">"x = (11-3)/2"</text>
  <rect x="280" y="480" width="60" height="12" rx="3" ry="3" fill="#0d9488" stroke="#0d9488" stroke-width="1.2"/>
  <text x="348" y="490" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#0f766e">+0.50</text>
  <line x1="420" y1="494" x2="420" y2="480" stroke="#0d9488" stroke-width="2"/>
  <polygon points="420,474.5 414.5,485.5 425.5,485.5" fill="#0d9488"/>
  <line x1="280" y1="292" x2="280" y2="322" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="3 3"/>
</svg>
