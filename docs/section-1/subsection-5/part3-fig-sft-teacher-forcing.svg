<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="336" viewBox="0 0 1060 336" role="img" aria-label="How the SFT loss is computed, token by token, under teacher forcing. The task x and a given expert example y from the SFT corpus are both fixed. At every step the model is fed the GIVEN prefix y-before-t, never its own output, and is scored on the probability it assigns to the example's next token: 0.71 for '2x', 0.92 for '=', 0.44 for '8', 0.97 for the comma, whose negative log-probabilities are 0.34, 0.08, 0.82 and 0.03. The 0.44 on '8' is the token the model fumbles and it dominates the loss. Summing over t gives 1.28 for this example; averaging over examples gives the SFT loss.">
  <rect x="0" y="0" width="1060" height="336" fill="#eef2f6"/>
  <rect x="14" y="12" width="512" height="48" rx="10" ry="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="30" y="33" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#334155">x = "Solve 2x + 3 = 11"</text>
  <text x="30" y="50" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">the task</text>
  <rect x="538" y="12" width="508" height="48" rx="10" ry="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="554" y="33" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#334155">y = "2x = 8 , x = 4"</text>
  <text x="554" y="50" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">the expert example, from D_SFT</text>
  <rect x="970" y="20" width="62" height="20" rx="10" ry="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="1001" y="33.78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9a3412">given</text>
  <rect x="14" y="74" width="1032" height="168" rx="14" ry="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="96" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#64748b">t</text>
  <text x="78" y="96" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#64748b">y_&lt;t    the GIVEN prefix</text>
  <text x="496" y="96" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#64748b">y_t</text>
  <text x="582" y="96" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#64748b">πθ(y_t)</text>
  <text x="700" y="96" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#64748b">−log πθ</text>
  <line x1="30" y1="104" x2="1030" y2="104" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="127" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">1</text>
  <text x="78" y="127" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">—</text>
  <text x="496" y="127" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="bold" fill="#0f766e">"2x"</text>
  <text x="582" y="127" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">0.71</text>
  <text x="700" y="127" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">0.34</text>
  <text x="40" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">2</text>
  <text x="78" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">"2x"</text>
  <text x="496" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="bold" fill="#0f766e">"="</text>
  <text x="582" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">0.92</text>
  <text x="700" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">0.08</text>
  <rect x="30" y="166" width="1000" height="25" rx="7" ry="7" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text x="40" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">3</text>
  <text x="78" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">"2x ="</text>
  <text x="496" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="bold" fill="#9a3412">"8"</text>
  <text x="582" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="bold" fill="#9a3412">0.44</text>
  <text x="700" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="bold" fill="#9a3412">0.82</text>
  <text x="776" y="183" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#c2410c">the token it fumbles — dominates the loss</text>
  <text x="40" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">4</text>
  <text x="78" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">"2x = 8"</text>
  <text x="496" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="bold" fill="#0f766e">","</text>
  <text x="582" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">0.97</text>
  <text x="700" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">0.03</text>
  <text x="40" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8">:</text>
  <rect x="408" y="108" width="68" height="118" rx="9" ry="9" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="442" y="163" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#334155">MODEL</text>
  <text x="442" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b">πθ</text>
  <line x1="378" y1="167" x2="398" y2="167" stroke="#64748b" stroke-width="2"/>
  <polygon points="409.5,167 398.5,161.5 398.5,172.5" fill="#64748b"/>
  <line x1="478" y1="167" x2="486" y2="167" stroke="#64748b" stroke-width="2"/>
  <polygon points="495.5,167 484.5,161.5 484.5,172.5" fill="#64748b"/>
  <text x="14" y="272" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#c2410c">always the GIVEN prefix — teacher forcing</text>
  <text x="14" y="294" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#64748b">at inference nothing hands it a prefix: it must consume its own tokens instead</text>
  <text x="582" y="272" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748b">sum over t</text>
  <rect x="668" y="260" width="56" height="19" rx="9" ry="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="696" y="273.35" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#334155">1.28</text>
  <line x1="732" y1="270" x2="752" y2="270" stroke="#0d9488" stroke-width="2"/>
  <polygon points="763.5,270 752.5,264.5 752.5,275.5" fill="#0d9488"/>
  <text x="766" y="274" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0f766e">mean over examples  =  L_SFT</text>
</svg>
