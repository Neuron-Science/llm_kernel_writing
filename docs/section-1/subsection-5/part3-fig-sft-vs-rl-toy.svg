<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="340" viewBox="0 0 1060 340" role="img" aria-label="Two ways to fine-tune, on one toy task. Left, SFT: the task goes through the model and the answer it produces is pushed toward a given expert example, word by word. Right, RL: the same task goes through the model, which samples three candidate answers; a checker scores them 0, 1 and 0, so the answer that scored 1 is reinforced and the two that scored 0 are pushed down. RL needs no example.">
  <rect x="0" y="0" width="1060" height="340" fill="#eef2f6"/>
  <rect x="14" y="10" width="500" height="290" rx="14" ry="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="30" y="38" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155">SFT</text>
  <text x="30" y="58" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#64748b">imitate one given example</text>
  <rect x="36" y="70" width="190" height="38" rx="12" ry="12" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <text x="131" y="93.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#334155">"Solve 2x + 3 = 11"</text>
  <line x1="131" y1="108" x2="131" y2="128" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="131,133.5 125.5,122.5 136.5,122.5" fill="#64748b"/>
  <rect x="36" y="134" width="190" height="40" rx="12" ry="12" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <text x="131" y="158.86" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#334155">MODEL  πθ</text>
  <line x1="131" y1="174" x2="131" y2="194" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="131,199.5 125.5,188.5 136.5,188.5" fill="#64748b"/>
  <rect x="36" y="200" width="190" height="38" rx="12" ry="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.5"/>
  <text x="131" y="223.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f766e">"2x = 8, x = 4"</text>
  <text x="240" y="224" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#64748b">==</text>
  <rect x="258" y="200" width="232" height="38" rx="12" ry="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="374" y="223.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#334155">"2x = 8, x = 4"</text>
  <text x="36" y="252" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#0f766e">what the model produced</text>
  <text x="258" y="252" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#64748b">the expert example, given</text>
  <text x="36" y="276" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#64748b">matched token by token — the loss needs the example</text>
  <rect x="528" y="10" width="518" height="290" rx="14" ry="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="544" y="38" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155">RL</text>
  <text x="544" y="58" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#64748b">sample answers, keep what the reward likes</text>
  <rect x="550" y="70" width="200" height="38" rx="12" ry="12" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <text x="650" y="93.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#334155">"Solve 2x + 3 = 11"</text>
  <line x1="650" y1="108" x2="650" y2="128" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="650,133.5 644.5,122.5 655.5,122.5" fill="#64748b"/>
  <rect x="550" y="134" width="200" height="40" rx="12" ry="12" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <text x="650" y="158.86" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#334155">MODEL  πθ</text>
  <polyline points="650,174 650,186 538,186 538,258" fill="none" stroke="#64748b" stroke-width="2"/>
  <line x1="538" y1="209" x2="546" y2="209" stroke="#64748b" stroke-width="2"/>
  <polygon points="555.5,209 544.5,203.5 544.5,214.5" fill="#64748b"/>
  <rect x="552" y="200" width="124" height="18" rx="6" ry="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="614" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#334155">"x = 7"</text>
  <line x1="682" y1="209" x2="699" y2="209" stroke="#dc2626" stroke-width="2"/>
  <polygon points="709.5,209 698.5,203.5 698.5,214.5" fill="#dc2626"/>
  <rect x="708" y="200" width="50" height="18" rx="9" ry="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="733" y="212.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">r = 0</text>
  <text x="766" y="213" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#991b1b">pushed down</text>
  <line x1="538" y1="233" x2="546" y2="233" stroke="#64748b" stroke-width="2"/>
  <polygon points="555.5,233 544.5,227.5 544.5,238.5" fill="#64748b"/>
  <rect x="552" y="224" width="124" height="18" rx="6" ry="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="614" y="237" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#334155">"x = 4"</text>
  <line x1="682" y1="233" x2="699" y2="233" stroke="#0d9488" stroke-width="2"/>
  <polygon points="709.5,233 698.5,227.5 698.5,238.5" fill="#0d9488"/>
  <rect x="708" y="224" width="50" height="18" rx="9" ry="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/>
  <text x="733" y="236.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f766e">r = 1</text>
  <text x="766" y="237" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#0f766e">reinforced</text>
  <line x1="538" y1="257" x2="546" y2="257" stroke="#64748b" stroke-width="2"/>
  <polygon points="555.5,257 544.5,251.5 544.5,262.5" fill="#64748b"/>
  <rect x="552" y="248" width="124" height="18" rx="6" ry="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="614" y="261" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#334155">"x = 9"</text>
  <line x1="682" y1="257" x2="699" y2="257" stroke="#dc2626" stroke-width="2"/>
  <polygon points="709.5,257 698.5,251.5 698.5,262.5" fill="#dc2626"/>
  <rect x="708" y="248" width="50" height="18" rx="9" ry="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="733" y="260.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">r = 0</text>
  <text x="766" y="261" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#991b1b">pushed down</text>
  <text x="550" y="276" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#0f766e">scored, not matched — no example anywhere</text>
</svg>
