  <text x="600" y="106" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748b">A_i</text>
  <text x="930" y="106" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748b">LEARN?</text>
