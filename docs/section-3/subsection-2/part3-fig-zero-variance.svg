<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="388" viewBox="0 0 1060 388" role="img" aria-label="Why a task can teach nothing at all under group-relative advantages. The advantage of sample i is its reward minus the group mean, divided by the group standard deviation, so if the standard deviation is zero every advantage is zero and there is no gradient. A task that is too hard scores minus one on all four kernels, a task that is too easy scores plus one point five on all four; both give identical rewards, zero spread, and a dead batch. Only the just-right task, whose four kernels score minus one, minus zero point five, plus one and plus one point five, produces a spread and therefore advantages of minus one point two, minus zero point seven, plus zero point seven and plus one point two — the only row that learns.">
  <rect x="0" y="0" width="1060" height="388" fill="#eef2f6"/>
  <rect x="14" y="10" width="1032" height="52" rx="10" ry="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text xml:space="preserve" x="30" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="bold" fill="#334155">A_i  =  ( r_i − mean(r) )  /  std(r)</text>
  <text x="500" y="44" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#9a3412">std(r) = 0   →   A = 0   →   no gradient</text>
  <rect x="14" y="76" width="1032" height="250" rx="14" ry="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
