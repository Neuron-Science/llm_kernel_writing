<svg xmlns="http://www.w3.org/2000/svg" width="512" height="588" viewBox="0 0 512 588" role="img" aria-label="The gated compile-correct-fast reward: a candidate kernel passes through a COMPILE gate then a CORRECT gate; failing compilation scores r_compile, compiling but being incorrect scores r_incorrect, and a compiled-and-correct kernel is paid f(speedup); a reward number line shows the ordering r_compile is at most r_incorrect is at most 0 is below f(speedup)">
  <!-- The gated compile-correct-fast reward, from the Section 3.2 cases block:
       a candidate kernel passes through two gates (compile, correct); failing
       either kicks it out to a penalty (r_compile, r_incorrect), and only a
       compiled-and-correct kernel is paid by speed via f(speedup). A reward
       number line at the bottom shows the ordering
       r_compile <= r_incorrect <= 0 < f(speedup). This matches the slide-5
       figure exactly (same box, gate, and number-line placement); the
       through-line caption lives in the page's figure caption rather than
       inside the SVG. Teal marks the paid reward, red/orange the two penalties. -->
  <rect x="0" y="0" width="512" height="588" fill="#eef2f6"/>

  <!-- ================= Candidate kernel (input) ================= -->
  <rect x="116" y="40" width="148" height="42" rx="10" ry="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="190" y="66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#334155">candidate kernel  y</text>
  <line x1="190" y1="82" x2="190" y2="102" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="190,107 183,97 197,97" fill="#64748b"/>

  <!-- ================= Gate 1: COMPILE ================= -->
  <rect x="90" y="107" width="200" height="62" rx="12" ry="12" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <circle cx="120" cy="138" r="16" fill="#64748b"/>
  <text x="120" y="144" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">1</text>
  <text x="148" y="134" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#334155">COMPILE?</text>
  <text x="148" y="155" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">does it build</text>
  <!-- fail branch -->
  <line x1="290" y1="138" x2="322" y2="138" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="326,138 316,133 316,143" fill="#dc2626"/>
  <text x="306" y="131" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#dc2626">fail</text>
  <rect x="328" y="112" width="166" height="52" rx="10" ry="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="411" y="135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#991b1b">r<tspan dy="4" font-size="11">compile</tspan></text>
  <text x="411" y="156" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#b91c1c">fails to compile</text>

  <!-- pass 1 -> 2 -->
  <line x1="190" y1="169" x2="190" y2="205" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="190,210 183,200 197,200" fill="#64748b"/>
  <text x="200" y="190" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0f766e">&#10003; pass</text>

  <!-- ================= Gate 2: CORRECT ================= -->
  <rect x="90" y="210" width="200" height="62" rx="12" ry="12" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <circle cx="120" cy="241" r="16" fill="#64748b"/>
  <text x="120" y="247" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">2</text>
  <text x="148" y="237" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#334155">CORRECT?</text>
  <text x="148" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">matches reference</text>
  <!-- fail branch -->
  <line x1="290" y1="241" x2="322" y2="241" stroke="#ea580c" stroke-width="2.5"/>
  <polygon points="326,241 316,236 316,246" fill="#ea580c"/>
  <text x="306" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#ea580c">fail</text>
  <rect x="328" y="215" width="166" height="52" rx="10" ry="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="411" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9a3412">r<tspan dy="4" font-size="11">incorrect</tspan></text>
  <text x="411" y="259" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c2410c">compiles, wrong</text>

  <!-- pass 2 -> reward -->
  <line x1="190" y1="272" x2="190" y2="308" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="190,313 183,303 197,303" fill="#64748b"/>
  <text x="200" y="293" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0f766e">&#10003; pass</text>

  <!-- ================= Paid reward: f(speedup) ================= -->
  <rect x="90" y="313" width="200" height="64" rx="12" ry="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="120" cy="345" r="16" fill="#0d9488"/>
  <text x="120" y="351" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">3</text>
  <text x="148" y="340" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f766e">f(speedup)</text>
  <text x="148" y="362" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#0f766e">reward set by speedup</text>

  <!-- ================= Reward number line ================= -->
  <text x="256" y="432" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#64748b">how each outcome scores</text>
  <text x="256" y="468" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#334155">r<tspan dy="4" font-size="11">compile</tspan><tspan dy="-4"> &#8804; r</tspan><tspan dy="4" font-size="11">incorrect</tspan><tspan dy="-4"> &#8804; 0 &lt; </tspan><tspan font-weight="bold" fill="#0f766e">f(speedup)</tspan></text>

  <text x="62" y="510" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">reward</text>
  <line x1="70" y1="524" x2="452" y2="524" stroke="#334155" stroke-width="2.5"/>
  <polygon points="466,524 452,518 452,530" fill="#334155"/>
  <text x="452" y="512" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#64748b">higher &#8594;</text>

  <!-- ticks: r_compile <= r_incorrect <= 0 < f(speedup) -->
  <circle cx="100" cy="524" r="6" fill="#dc2626"/>
  <text x="100" y="547" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#991b1b">r<tspan dy="3" font-size="9">compile</tspan></text>
  <circle cx="180" cy="524" r="6" fill="#ea580c"/>
  <text x="180" y="547" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#9a3412">r<tspan dy="3" font-size="9">incorrect</tspan></text>
  <line x1="300" y1="514" x2="300" y2="534" stroke="#334155" stroke-width="2"/>
  <text x="300" y="548" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">0</text>
  <circle cx="430" cy="524" r="6" fill="#0d9488"/>
  <text x="430" y="547" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#0f766e">f(speedup)</text>
</svg>
