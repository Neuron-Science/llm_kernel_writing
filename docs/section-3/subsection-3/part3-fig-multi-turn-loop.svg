<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="330" viewBox="0 0 1060 330" role="img" aria-label="Multi-turn RL on the running example, with the same policy sampling at every turn. Turn one: the history is just the spec, the model sums x times x in fp16, feedback says wrong — it needs fp32 — and the reward is 0. Turn two: the history is the spec plus turn one's kernel and its feedback, the model switches to fp32, feedback says correct but slow at 0.8 times, reward still 0. Turn T: the history carries turn two as well, the model enlarges BLOCK_N, feedback says correct at 1.8 times, and the reward is 1.0. The feedback from each turn is what conditions the next. The whole trajectory is then optimized as one unit: maximize the expected sum of rewards in a single GRPO step.">
  <rect x="0" y="0" width="1060" height="330" fill="#eef2f6"/>
  <rect x="14" y="10" width="1032" height="42" rx="10" ry="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text xml:space="preserve" x="30" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="bold" fill="#334155">x = "fused RMSNorm,  (M, N) = (4096, 1024) fp16,  H100"</text>
  <text x="30" y="46" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">MODEL πθ, init from SFT — the SAME policy samples y_t at every turn</text>
  <rect x="14" y="62" width="320" height="172" rx="14" ry="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="32" y="86" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">TURN 1</text>
  <rect x="264" y="72" width="56" height="20" rx="9" ry="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="292" y="85.675" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#991b1b">r = 0</text>
  <rect x="30" y="96" width="288" height="26" rx="7" ry="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="40" y="113" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748b">h_1 = x</text>
  <rect x="30" y="128" width="288" height="28" rx="7" ry="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text xml:space="preserve" x="40" y="147" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#334155">y_1   sum(x*x) in fp16</text>
  <rect x="30" y="162" width="288" height="30" rx="7" ry="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="40" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#991b1b">f_1</text>
  <text x="74" y="181" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#991b1b">WRONG — needs fp32</text>
  <text x="32" y="212" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">the feedback names the fix</text>
  <line x1="334" y1="148" x2="372" y2="148" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="383.5,148 372.5,142.5 372.5,153.5" fill="#dc2626"/>
  <text x="356" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">f_1</text>
  <rect x="364" y="62" width="320" height="172" rx="14" ry="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="382" y="86" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">TURN 2</text>
  <rect x="614" y="72" width="56" height="20" rx="9" ry="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="642" y="85.675" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9a3412">r = 0</text>
  <rect x="380" y="96" width="288" height="26" rx="7" ry="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="390" y="113" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748b">h_2 = x + (y_1, f_1)</text>
  <rect x="380" y="128" width="288" height="28" rx="7" ry="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text xml:space="preserve" x="390" y="147" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#334155">y_2   sum(x*x) in fp32</text>
  <rect x="380" y="162" width="288" height="30" rx="7" ry="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
  <text x="390" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#9a3412">f_2</text>
  <text x="424" y="181" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#9a3412">ok but SLOW   0.8x</text>
  <text x="382" y="212" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">correct now, but not fast</text>
  <line x1="684" y1="148" x2="722" y2="148" stroke="#ea580c" stroke-width="2.5"/>
  <polygon points="733.5,148 722.5,142.5 722.5,153.5" fill="#ea580c"/>
  <text x="706" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#9a3412">f_2</text>
  <rect x="714" y="62" width="320" height="172" rx="14" ry="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="732" y="86" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">TURN T</text>
  <rect x="964" y="72" width="56" height="20" rx="9" ry="9" fill="#0d9488" stroke="#0d9488" stroke-width="1.4"/>
  <text x="992" y="85.675" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff">r = 1.0</text>
  <rect x="730" y="96" width="288" height="26" rx="7" ry="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="740" y="113" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748b">h_T = h_2 + (y_2, f_2)</text>
  <rect x="730" y="128" width="288" height="28" rx="7" ry="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text xml:space="preserve" x="740" y="147" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#334155">y_T   ... bigger BLOCK_N</text>
  <rect x="730" y="162" width="288" height="30" rx="7" ry="7" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/>
  <text x="740" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#0f766e">f_T</text>
  <text x="774" y="181" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#0f766e">ok,   1.8x</text>
  <text x="732" y="212" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">the reward finally lands</text>
  <polyline points="174,234 174,256 880,256 880,234" fill="none" stroke="#0d9488" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="14" y="272" width="1032" height="44" rx="10" ry="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.2"/>
  <text xml:space="preserve" x="30" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#0f766e">max  E[ r_1 + r_2 + ... + r_T ]</text>
  <text x="310" y="292" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f766e">→   ONE GRPO step over the WHOLE trajectory</text>
  <text x="30" y="310" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#0f766e">the turns are not independent episodes: the chain is the unit of optimization</text>
</svg>
