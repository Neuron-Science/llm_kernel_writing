<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="408" viewBox="0 0 1060 408" role="img" aria-label="How one seed pair is multiplied into many. The seed is the single RMSNorm task and its kernel. Three augmentation axes fan out from it. One, reasoning: prepend a derivation — one program per row, reduce along the columns, memory-bound so fuse, BLOCK_N the next power of two, mask the tail, accumulate in fp32 — leaving the kernel unchanged, so the model reasons before it commits. Two, task and config: sweep across operators such as LayerNorm, softmax and RMSNorm-plus-residual, and within the operator sweep N, M, dtype and target, turning one pair into k pairs where the shape picks the variant: small N goes multi-row, large N goes blocked reduction. Three, metadata: tag the same pair with backend NKI on Trainium, difficulty medium, category normalization, and put the tag in the prompt so generation can be conditioned and scarce backends up-weighted.">
  <rect x="0" y="0" width="1060" height="408" fill="#eef2f6"/>
  <rect x="14" y="10" width="1032" height="78" rx="12" ry="12" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <circle cx="44" cy="49" r="17" fill="#64748b"/>
  <text x="44" y="54.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">S</text>
  <text x="72" y="34" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#334155">SEED</text>
  <text x="72" y="54" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#64748b">one (x, y) pair — the RMSNorm task</text>
  <text xml:space="preserve" x="72" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#334155">x:  fused RMSNorm over the last dim,  (M, N) = (4096, 1024) fp16,  H100</text>
  <rect x="636" y="22" width="400" height="54" rx="8" ry="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text xml:space="preserve" x="650" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#334155">y:  @triton.jit</text>
  <text xml:space="preserve" x="650" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#334155">    def rmsnorm_kernel(x_ptr, w_ptr, ...):</text>
  <text xml:space="preserve" x="650" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#94a3b8">          # one program per row</text>
  <line x1="530" y1="88" x2="530" y2="100" stroke="#64748b" stroke-width="2.5"/>
  <line x1="186" y1="100" x2="874" y2="100" stroke="#64748b" stroke-width="2.5"/>
  <line x1="186" y1="100" x2="186" y2="113" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="186,118.5 180.5,107.5 191.5,107.5" fill="#64748b"/>
  <line x1="530" y1="100" x2="530" y2="113" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="530,118.5 524.5,107.5 535.5,107.5" fill="#64748b"/>
  <line x1="874" y1="100" x2="874" y2="113" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="874,118.5 868.5,107.5 879.5,107.5" fill="#64748b"/>
  <rect x="14" y="118" width="344" height="240" rx="14" ry="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="44" cy="144" r="14" fill="#0d9488"/>
  <text x="44" y="149.04" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <text x="68" y="141" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#334155">REASONING</text>
  <text x="68" y="158" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#0f766e">y := trace ++ y</text>
  <text x="34" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#334155">&lt;reasoning&gt;</text>
  <text x="34" y="209" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#334155">one program per row,</text>
  <text x="34" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#334155">reduce along the columns.</text>
  <text x="34" y="239" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#334155">memory-bound → fuse:</text>
  <text x="34" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#334155">load once, stay on-chip, store once.</text>
  <text x="34" y="269" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#334155">BLOCK_N = next pow2 ≥ N,</text>
  <text x="34" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#334155">mask the tail, accumulate x*x in fp32.</text>
  <text x="34" y="299" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#334155">&lt;/reasoning&gt;</text>
  <text xml:space="preserve" x="34" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#94a3b8">@triton.jit ...   (unchanged)</text>
  <text x="34" y="348" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#0f766e">reason, then commit</text>
  <rect x="358" y="118" width="344" height="240" rx="14" ry="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="388" cy="144" r="14" fill="#64748b"/>
  <text x="388" y="149.04" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="412" y="141" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#334155">TASK / CONFIG</text>
  <text x="412" y="158" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#334155">one pair → k pairs</text>
  <text x="378" y="194" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#64748b">across operators</text>
  <text x="378" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#334155">LayerNorm, softmax,</text>
  <text x="378" y="227" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#334155">RMSNorm + residual add</text>
  <text x="378" y="250" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#64748b">within the operator</text>
  <text xml:space="preserve" x="378" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#334155">N        256 | 1024 | 8192</text>
  <text xml:space="preserve" x="378" y="283" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#334155">M        128 | 4096</text>
  <text xml:space="preserve" x="378" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#334155">dtype    fp16 | bf16 | fp32</text>
  <text xml:space="preserve" x="378" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#334155">target   H100 | A100</text>
  <text x="378" y="348" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#334155">the shape picks the variant</text>
  <rect x="702" y="118" width="344" height="240" rx="14" ry="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="732" cy="144" r="14" fill="#ea580c"/>
  <text x="732" y="149.04" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="756" y="141" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#334155">METADATA</text>
  <text x="756" y="158" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#9a3412">same pair, now tagged</text>
  <text xml:space="preserve" x="722" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#334155">backend    : NKI (Trainium)</text>
  <text x="722" y="209" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#334155">difficulty : medium</text>
  <text xml:space="preserve" x="722" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#334155">category   : normalization</text>
  <text x="722" y="247" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#64748b">the tag enters the prompt</text>
  <text x="722" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#334155">"Backend: NKI (Trainium)</text>
  <text xml:space="preserve" x="722" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#334155">  Write a kernel that ..."</text>
  <text x="722" y="348" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#9a3412">condition generation, up-weight scarce backends</text>
  <rect x="14" y="368" width="1032" height="30" rx="9" ry="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/>
  <text x="30" y="388" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0f766e">one seed  →  reasoning × config × metadata  →  a corpus</text>
  <text x="494" y="388" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#0f766e">the three axes compose: any pair can carry a trace, a config sweep and a tag at once</text>
</svg>
